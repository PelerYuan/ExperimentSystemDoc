<svg class="rig" preserveAspectRatio="xMidYMid meet" viewBox="0 0 1000 500" role="img" aria-labelledby="rig-title rig-desc">
<title id="rig-title">钻机实验系统架构</title>
<desc id="rig-desc">工控计算机与实验电源放置在工作台上。数据线从工控计算机连接到千分表、扭矩传感器、压力传感器、红外温感、数据采集器和 USB 串口转换器。钻头位于实验木材上方，木材放置在传感器、置物台以及 X、Y 轴滑轨之上。</desc>
