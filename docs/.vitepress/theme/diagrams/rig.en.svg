<svg class="rig" preserveAspectRatio="xMidYMid meet" viewBox="0 0 1000 500" role="img" aria-labelledby="rig-title rig-desc">
<title id="rig-title">Drilling Experiment System Architecture</title>
<desc id="rig-desc">An industrial control computer and a laboratory power supply sit on a workbench. Data lines run from the computer to a dial indicator, torque sensor, pressure sensor, infrared thermometer, a data acquisition unit and a serial converter. The drilling platform holds a drill bit above the raw material, which rests on the sensors, a stage, and X- and Y-axis linear guides.</desc>
